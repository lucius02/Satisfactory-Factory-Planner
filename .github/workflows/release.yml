name: Release

# Bouwt de Tauri-installers voor Windows en Linux en publiceert ze direct als release op GitHub.
# Start: push een tag `v*` (bijv. `git tag v0.3.0 && git push origin v0.3.0`) of handmatig.
# De tag moet gelijk zijn aan `version` in package.json (Tauri leest die versie).
#
# Windows code signing staat (nog) uit: de installers zijn ongetekend, dus SmartScreen
# waarschuwt bij installeren.
#
# Updater-handtekening (verplicht sinds createUpdaterArtifacts aan staat):
#   TAURI_SIGNING_PRIVATE_KEY           inhoud van ~/.tauri/fabrieksplanner.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  wachtwoord van die sleutel (leeg)
#
# De release wordt direct gepubliceerd: geïnstalleerde apps vinden de update via latest.json
# van de laatste release en installeren hem automatisch.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          # feedback worker URL (repository variable, see feedback-worker/README.md)
          VITE_FEEDBACK_URL: ${{ vars.FEEDBACK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tekent de updatebestanden; de app installeert alleen updates met een geldige handtekening.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Satisfactory Factory Planner ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
